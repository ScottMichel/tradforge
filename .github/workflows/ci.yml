name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push on the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see every failing combination, not only the first one
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Run the built command line
        run: node packages/cli/dist/cli/bin.js --version

  package:
    name: Desktop application (Windows executable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the portable executable
        run: npm run desktop:package
      # Downloadable from the page of the run, to try the application of any commit.
      - uses: actions/upload-artifact@v4
        with:
          name: tradforge-portable
          path: packages/desktop/release/tradforge-*-portable.exe
          retention-days: 14
          if-no-files-found: error
