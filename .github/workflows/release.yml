name: Release

# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds the desktop application on Windows and
# publishes it as a GitHub release, with its checksum and the notes of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the versions and write the notes
        run: node .github/scripts/release.mjs "${{ github.ref_name }}" release-notes.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the portable executable
        run: npm run desktop:package
      - name: Compute its checksum
        shell: pwsh
        run: |
          $exe = Get-Item "packages/desktop/release/tradforge-*-portable.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii -NoNewline "$($exe.FullName).sha256"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "tradforge ${{ github.ref_name }}"
          --notes-file release-notes.md
          packages/desktop/release/tradforge-*-portable.exe
          packages/desktop/release/tradforge-*-portable.exe.sha256
